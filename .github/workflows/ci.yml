# PR gate (KICKOFF §7 "Runs"): lint → types → tests (incl. fitness gates +
# SIGKILL crash test) → perf-gate warnings (KICKOFF §6 PR subset) →
# demo-run-twice → wheel purity. Nightly trends + deep torture: nightly.yml (later).
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync environment (Python pinned via .python-version; extras for their tests)
        run: uv sync --all-extras

      - name: Lint (ruff)
        run: uvx ruff check .

      - name: Suppressions (standard typed-python — noqa codes and reasons in src/)
        run: |
          uv run scripts/test_check_suppressions.py
          uv run scripts/check_suppressions.py

      - name: Mutation check script (its self-tests; the check itself runs locally, #193)
        run: uv run scripts/test_mutation_changed.py

      - name: Type check (Pyrefly — src, examples, benchmarks, tests)
        run: uv run pyrefly check

      - name: Tests (unit, property, integration, extras, fitness gates)
        run: uv run pytest -q

      - name: Perf gates (KICKOFF §6 PR subset — same-run ratios, warn-stage)
        if: matrix.os == 'ubuntu-latest'
        run: DC_BENCH_SPECIMENS=30000 uv run pytest benchmarks -q -s

      - name: Demo survives a rerun (persistence smoke)
        run: |
          uv run python examples/minerals/demo.py
          uv run python examples/minerals/demo.py

      - name: Journal survives a rerun (M2 scenes incl. async session)
        run: |
          uv run python examples/journal/journal.py
          uv run python examples/journal/journal.py

      - name: Wheel purity (fitness #17 — pure py3-none-any, no native code)
        run: |
          uv build
          python3 - << 'EOF'
          import glob, sys, zipfile
          wheels = glob.glob("dist/*.whl")
          assert wheels, "no wheel built"
          [wheel] = wheels
          assert "py3-none-any" in wheel, f"wheel is not pure: {wheel}"
          bad = [n for n in zipfile.ZipFile(wheel).namelist()
                 if n.endswith((".so", ".pyd"))]
          assert not bad, f"native code in the wheel: {bad}"
          print(f"wheel OK: {wheel}")
          EOF

  docs-wrap:
    # Standard teaching-docs: one sentence per line, on the Markdown lines the PR adds (no-op on push to main).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: check_wrap self-tests
        run: uv run scripts/test_check_wrap.py

      - name: One sentence per line
        run: uv run scripts/check_wrap.py --since "origin/${{ github.base_ref }}"

  test-rules:
    # Standard readable-tests: testrules on every test module the PR changes (no-op on push to main).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: testrules self-tests
        run: uv run scripts/test_testrules.py

      - name: Changed test modules
        run: git diff --name-only --diff-filter=d "origin/${{ github.base_ref }}...HEAD" -- ':(glob)tests/**/test_*.py' ':(glob)benchmarks/test_*.py' scripts/test_check_suppressions.py > changed.txt

      - name: Gate
        run: |
          if [ -s changed.txt ]; then xargs uv run scripts/testrules.py < changed.txt; else echo "no test module changed"; fi
