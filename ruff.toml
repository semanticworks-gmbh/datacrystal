# Adopted from tetrahedron's ruff.toml (#186). A rule group is selected once it is at 0 on the paths
# it covers; a group not yet clean is left out here, and the issue named beside it switches it on.
# Run unpinned: `uvx ruff check .` (a new release's findings show at once).
line-length = 100
src = ["src", "tests"]

[lint]
preview = true
explicit-preview-rules = true
extend-select = [
    # self-documenting-code: the google docstring rules that are at 0 in src/
    "D100", "D101", "D103", "D104", "D106", "D200", "D201", "D202", "D206", "D207", "D208",
    "D209", "D210", "D211", "D212", "D214", "D300", "D301", "D402", "D405", "D410", "D411",
    "D412", "D414", "D416", "D417", "D418", "D419",
    "W505", "PLR0916", # docstring and comment line length (max-doc-length below), too many boolean terms
    # typed-python: ANN401 (Any) is left out until #192
    "ANN001", "ANN002", "ANN003", "ANN201", "ANN202", "ANN204", "ANN205", "ANN206",
    "D", "D401", "ANN", # the target set; the ignores below hold the paths that are not at 0 yet
    "PT", "FBT001", # readable-tests, tests only (ignored elsewhere below)
    "T20", # structured-logging: no print() outside CLI output
]
# extend-select adds to ruff's own default set (E4, E7, E9, F and the 0.17 additions), which is on and at 0.
# Not selected yet: D102, D105, D107, D403, D415, D401 (docstring form): #191;
# C901, PLR2004, ANN401 in src/: #192.
# D205 stays off as in tetrahedron (the summary may run into the first paragraph).
extend-ignore = ["D205"]

[lint.per-file-ignores]
# print() is CLI output in scripts, examples and the on-demand proving grounds and benchmarks.
"{scripts/**,examples/**,evals/**,benchmarks/**}" = ["T20"]
# Ruff cannot select a rule for some files only, so the test rules are ignored everywhere else.
"!{tests/**,scripts/test_*.py,benchmarks/test_*.py,**/conftest.py}" = ["PT", "FBT001"]
# Not library code: on-demand proving grounds and runnable examples.
"examples/**" = ["D"]
"benchmarks/**" = ["D", "ANN"]
"evals/**" = ["D", "ANN"]
# Test modules (same ignores as semantic-studio): a fixture, helper or test double is named for what it does,
# so a docstring would restate it (D103, D107); a Given / When / Then line ends without a period (D415, readable-tests).
"{tests/**,scripts/test_*.py,benchmarks/test_*.py}" = ["D103", "D107", "D415"]
# Outside the tests the groups below are not at 0 yet: #191 (docstring form) and #192 (Any) switch them on.
"{src/**,examples/**,scripts/**,evals/**,benchmarks/**}" = ["D102", "D105", "D107", "D401", "D403", "D415", "ANN401"]

[lint.flake8-bugbear]
# FastAPI dependency markers in a route signature are immutable by design.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Body"]

[lint.pydocstyle]
convention = "google"

[lint.pycodestyle]
max-doc-length = 100
