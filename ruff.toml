# Adopted from tetrahedron's ruff.toml (#186). Every rule group below is at 0 on the paths it covers.
# Run unpinned: `uvx ruff check .` (a new release's findings show at once).
line-length = 100
src = ["src", "tests"]

[lint]
preview = true
explicit-preview-rules = true
extend-select = [
    "E4", "E7", "E9", "F", # the long-standing default set, named so a release that narrows the default cannot narrow the gate
    # self-documenting-code: the google docstring rules that are at 0 in src/
    "D100", "D101", "D103", "D104", "D106", "D200", "D201", "D202", "D206", "D207", "D208",
    "D209", "D210", "D211", "D212", "D214", "D300", "D301", "D402", "D405", "D410", "D411",
    "D412", "D414", "D416", "D417", "D418", "D419",
    "W505", "PLR0916", # docstring and comment line length (max-doc-length below), too many boolean terms
    "D", "D401", "ANN", # typed-python incl. ANN401 (Any); the ignores below hold the paths that are not at 0
    "C901", "PLR2004", # self-documenting-code: complexity 10, a named constant for a magic value (tetrahedron's target set)
    "BLE001", "TRY004", "UP007", # the rules a line-level `# noqa: <code> - <reason>` in src/ may waive (scripts/check_suppressions.py)
    "B008", "PYI034", # fixed, never waived
    "RUF100", # a noqa that suppresses nothing is dead
    "PT", "FBT001", # readable-tests, tests only (ignored elsewhere below)
    "T20", # structured-logging: no print() outside CLI output
]
# extend-select keeps ruff's own default set on and names E4, E7, E9, F explicitly, so a narrower default cannot narrow the gate.
# T20 is at 0 outside the CLI paths ignored below.
# The docstring form (D102, D105, D107, D401, D403, D415) gates in src/ and scripts/ since #191;
# the five-body-line limit has no ruff rule and is checked in review.
# D205 stays off as in tetrahedron (the summary may run into the first paragraph).
extend-ignore = ["D205"]

[lint.per-file-ignores]
# print() is CLI output in scripts, examples and the on-demand proving grounds and benchmarks.
"{scripts/**,examples/**,evals/**,benchmarks/**}" = ["T20"]
# Ruff cannot select a rule for some files only, so the test rules are ignored everywhere else.
"!{tests/**,scripts/test_*.py,benchmarks/test_*.py,**/conftest.py}" = ["PT", "FBT001"]
# Not library code: on-demand proving grounds and runnable examples (no docstrings required).
"examples/**" = ["D"]
"benchmarks/**" = ["D"]
"evals/**" = ["D"]
# Test modules (same ignores as semantic-studio): a fixture, helper or test double is named for what it does,
# so a docstring would restate it (D103, D107); a Given / When / Then line ends without a period (D415, readable-tests).
"{tests/**,scripts/test_*.py,benchmarks/test_*.py}" = ["D103", "D107", "D415"]
# readable-tests wants the expected value as a literal in the assert (DAMP over DRY), as in tetrahedron's ruff.toml.
"{tests/**,scripts/test_*.py,benchmarks/test_*.py,**/conftest.py}" = ["PLR2004"]

[lint.flake8-bugbear]
# FastAPI dependency markers in a route signature are immutable by design.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Body"]

[lint.pydocstyle]
convention = "google"

[lint.pycodestyle]
max-doc-length = 100
