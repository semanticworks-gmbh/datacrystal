[project]
name = "datacrystal"
version = "0.10.0"
description = "Embedded object-graph database for Python — your live objects, crystallized: transparent, pickle-free persistence with built-in queries, full-text/vector search, and zero-copy Arrow analytics"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sven Hodapp", email = "sven.hodapp@gmail.com" }]
requires-python = ">=3.14"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Topic :: Database :: Database Engines/Servers",
    "Typing :: Typed",
]
dependencies = [
    "msgspec>=0.21.1",
    "pyroaring>=1.1.0",
]

[project.optional-dependencies]
fts = [
    "snowballstemmer>=3.0",
]
arrow = [
    "pyarrow>=21",
]
web = [
    "pydantic>=2",
    "fastapi",
    "strawberry-graphql",
]
follower = [
    "httpx>=0.28",
    "pydantic>=2",
]

[dependency-groups]
dev = [
    "duckdb>=1.5.3",
    "httpx>=0.28",
    "hypothesis>=6.155.2",
    "pyrefly>=1.3.2",
    "mutmut>=3.8.0",
    "pytest>=9.0.3",
    "uvicorn>=0.34",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/datacrystal"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyrefly]
project-includes = ["src", "examples", "benchmarks", "tests"]
search-path = ["typings", "src", "."]  # typings first (stubs), then src so datacrystal is not src.datacrystal, then "." for `from benchmarks import _gen`

[tool.mutmut]
source_paths = ["src/datacrystal/"]
# tests leave global state (the entity registry); a fork per mutant from a clean server keeps runs independent
process_isolation = "forkserver"
pytest_add_cli_args_test_selection = ["tests/"]
also_copy = ["mutation", "tests", "docs", "scripts", "examples", "benchmarks", "evals", "assets", "typings", "README.md", "CHANGELOG.md", "CONTRIBUTING.md", "AGENTS.md", "CLAUDE.md", "llms.txt", "LICENSE", ".python-version"]
# trampolines add `import mutmut...` to src/, which the engine-free gate rightly rejects
pytest_add_cli_args = ["-p", "no:cacheprovider", "-p", "mutation.mutmut_order", "--deselect", "tests/fitness/test_contract_engine_free.py::test_contract_package_imports_no_engine"]
